name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
permissions: {}

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up libbitcoinkernel
        uses: $/.github/actions/setup-libbitcoinkernel

      - name: Install cargo-hack
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-hack

      - name: Install Nightly Rust Toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt,clippy --no-self-update
          rustup default nightly

      - name: Spell check
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          config: ./_typos.toml

      - name: Run cargo fmt
        run: cargo +nightly fmt --all --check

      - name: Run cargo doc (each crate)
        run: |
          #!/usr/bin/env bash
          set -e
          CRATES=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.source == null and (.targets | map(.kind | contains(["lib"])) | any)) | .name' | tr '\n' ' ')
          echo "Building docs for crates: $CRATES"
          for crate in $CRATES; do
            echo "Running cargo doc for: $crate"
            RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc -p "$crate" --no-deps --lib --all-features --document-private-items || exit 1
          done

      - name: Run cargo clippy
        run: ./contrib/feature_matrix.sh clippy '-- -D warnings'
        shell: bash # Ensure the script runs using bash on all platforms

  cross-testing:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up libbitcoinkernel
        uses: $/.github/actions/setup-libbitcoinkernel

      - name: Install 1.85.0 Rust Toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.85.0

      - name: Install cargo-hack
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2.82.8
        with:
          tool: cargo-hack

      # Bi-weekly numbers to refresh caches every two weeks, ensuring recent project changes are cached
      - name: Set bi-weekly cache key
        # Use '10#' to always treat week number as base-10 (avoids octal when number has a leading zero)
        run: |
          YEAR=$(date +%Y)
          WEEK=$(date +%U)
          BIWEEK=$(( (10#$WEEK + 1) / 2 ))
          echo "CACHE_VERSION=${YEAR}(${BIWEEK})" >> $GITHUB_ENV
        shell: bash

      # Restore cached dependencies and build artifacts
      - name: Restore Rust cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          # Cache key depends on the bi-week we are on (cache version)
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      # Build only the binaries (florestad and floresta-cli separately to avoid feature conflicts)
      - name: Build binaries
        run: |
          cargo build --release -p florestad --verbose
          cargo build --release -p floresta-cli --verbose

      # Run the feature testing script
      - name: Run feature tests
        run: ./contrib/feature_matrix.sh test --verbose
        shell: bash # Ensure the script runs using bash on all platforms

      # Save cache only if the previous steps succeeded and there was not an exact cache key match
      # This happens everytime we modify any `cargo.lock` or `cargo.toml`, or each two weeks (caching recent changes)
      - name: Save Rust cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  no-std:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: floresta-common
            feature_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install 1.85.0 Rust Toolchain and no-std Target
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target thumbv7em-none-eabi --no-self-update
          rustup default 1.85.0

      - name: Install ARM GCC (for secp256k1-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build ${{ matrix.crate }} for no_std target
        shell: bash
        run: |
          cargo build -p "${{ matrix.crate }}" \
            --target thumbv7em-none-eabi \
            --no-default-features \
            ${{ matrix.feature_args }} \
            --locked

  # The workspace uses the published `floresta-common`, so changes to the in-tree copy aren't seen
  # by the crates that depend on it until a release. Check the workspace with the in-tree copy
  # patched in to catch those breaks early.
  local-floresta-common:
    runs-on: ubuntu-latest
    env:
      PATCH_FLORESTA_COMMON: 'patch.crates-io.floresta-common.path="crates/floresta-common"'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up libbitcoinkernel
        uses: $/.github/actions/setup-libbitcoinkernel

      - name: Install 1.85.0 Rust Toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0

      # Cargo ignores the patch, without failing, if the in-tree version doesn't match the pinned one
      - name: Check that the in-tree floresta-common is used
        run: |
          SOURCES=$(cargo metadata --format-version 1 --config "$PATCH_FLORESTA_COMMON" | jq -r '.packages[] | select(.name == "floresta-common") | .source')
          if [ "$SOURCES" != "null" ]; then
            echo "::error::The in-tree floresta-common version doesn't match the one pinned in Cargo.toml, so it can't be patched in"
            exit 1
          fi

      # Check each crate on its own, like `just build`: checking the whole workspace at once unifies
      # features that conflict (e.g. `floresta-rpc/async` breaks `floresta-cli`). `check` is enough
      # to catch API breaks, and doesn't try to link the fuzz targets without `cargo fuzz`.
      - name: Check each crate with the in-tree floresta-common
        run: |
          CRATES=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.source == null) | .name')
          for crate in $CRATES; do
            echo "Checking $crate"
            cargo check -p "$crate" --all-targets --config "$PATCH_FLORESTA_COMMON" || exit 1
          done

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('contrib/docker/Dockerfile') }}

      - name: Build Docker image
        run: |
          docker buildx build \
          --cache-to=type=local,dest=/tmp/.buildx-cache \
          --cache-from=type=local,src=/tmp/.buildx-cache \
          -f contrib/docker/Dockerfile \
          -t dlsz/floresta:latest .
